<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess That Baller!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bungee&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#ff7a00;
    --blue:#00e5ff;
    --pink:#ff1e8e;
    --yellow:#ffd400;
    --purple:#7b00ff;
    --green:#00ff85;
    --court:#0a0014;
    --panel:#15012b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Press Start 2P', monospace;
    background:
      radial-gradient(circle at 50% 0%, #2a0050 0%, var(--court) 60%),
      var(--court);
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    overflow-x:hidden;
  }
  /* CRT scanline overlay for that arcade nostalgia */
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.18) 3px,
      rgba(0,0,0,0) 4px);
    z-index:9999;
    mix-blend-mode:multiply;
  }
  .cabinet{
    width:100%;
    max-width:760px;
    background:var(--panel);
    border:6px solid var(--blue);
    border-radius:18px;
    box-shadow:
      0 0 0 6px #000,
      0 0 40px var(--purple),
      0 0 80px rgba(0,229,255,.4);
    padding:22px 20px 26px;
    position:relative;
  }
  /* ---- Title ---- */
  .title{
    font-family:'Bungee', sans-serif;
    text-align:center;
    line-height:1.05;
    margin-bottom:6px;
  }
  .title .l1{
    font-size:clamp(34px,9vw,64px);
    background:linear-gradient(180deg,#fff 0%,var(--yellow) 45%,var(--orange) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 4px 0 #000;
    letter-spacing:2px;
  }
  .title .l2{
    font-size:clamp(13px,3.4vw,20px);
    color:var(--blue);
    text-shadow:0 0 10px var(--blue), 2px 2px 0 #000;
    margin-top:4px;
  }
  .flames{font-size:clamp(18px,5vw,30px);letter-spacing:6px;margin-top:4px;}
  .logo{
    display:block;
    width:100%;
    max-width:540px;
    height:auto;
    margin:2px auto 0;
    border-radius:12px;
    box-shadow:0 0 0 3px #000, 0 0 24px rgba(255,122,0,.5), 0 0 48px rgba(123,0,255,.45);
  }

  .sub{
    text-align:center;
    font-size:9px;
    color:#bda7ff;
    line-height:1.8;
    margin:16px auto 18px;
    max-width:540px;
  }
  .sub .how{
    display:inline-block;
    margin-top:4px;
    padding:10px 14px;
    font-size:11px;
    line-height:1.6;
    color:var(--yellow);
    border:2px solid rgba(255,212,0,.5);
    border-radius:8px;
    background:rgba(255,212,0,.07);
    text-shadow:1px 1px 0 #000;
  }
  .sub .fire{
    display:inline-block;
    margin-top:12px;
    font-size:11px;
    color:var(--orange);
    text-shadow:0 0 10px rgba(255,122,0,.6), 1px 1px 0 #000;
  }

  h2.section{
    font-size:16px;
    color:var(--yellow);
    text-align:center;
    margin:24px 0 16px;
    text-shadow:2px 2px 0 #000;
    letter-spacing:1px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:11px;
  }
  h2.section .step{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:32px;height:32px;
    border-radius:50%;
    background:linear-gradient(180deg,var(--orange),#b84600);
    color:#fff;
    border:3px solid #000;
    box-shadow:0 0 16px rgba(255,122,0,.8);
    font-size:16px;
    flex:0 0 auto;
  }
  h2.section small{display:block;font-size:8px;color:#bda7ff;margin-top:8px;letter-spacing:1px;}

  /* ---- Difficulty selector ---- */
  .difficulties{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
    margin-bottom:6px;
  }
  .diff-btn{
    font-family:'Press Start 2P',monospace;
    font-size:10px;
    color:#fff;
    background:linear-gradient(180deg,#2b0a5a,#16002e);
    border:3px solid #3a1a6a;
    border-radius:10px;
    padding:12px 8px;
    cursor:pointer;
    text-align:center;
    line-height:1.5;
    transition:transform .07s, box-shadow .1s, border-color .1s, filter .1s;
  }
  .diff-btn .dots{display:block;font-size:11px;letter-spacing:2px;margin-bottom:8px;color:var(--orange);}
  .diff-btn small{display:block;font-size:7px;color:#9d86d6;margin-top:7px;line-height:1.5;}
  .diff-btn:hover{filter:brightness(1.2);}
  .diff-btn.active{
    border-color:var(--yellow);
    background:linear-gradient(180deg,#4a1a8a,#2a0a55);
    box-shadow:0 0 16px rgba(255,212,0,.55), inset 0 0 12px rgba(255,212,0,.15);
    transform:translateY(-2px);
  }
  .diff-btn.active .dots{color:var(--yellow);}
  .diff-btn.active small{color:#e7d7ff;}

  /* ---- Decade buttons ---- */
  .decades{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:12px;
  }
  .arcade-btn{
    font-family:'Press Start 2P',monospace;
    font-size:11px;
    color:#000;
    background:linear-gradient(180deg,var(--yellow),var(--orange));
    border:3px solid #000;
    border-radius:10px;
    padding:16px 10px;
    cursor:pointer;
    box-shadow:0 5px 0 #7a3a00, 0 0 14px rgba(255,122,0,.6);
    transition:transform .07s, box-shadow .07s, filter .1s;
    text-transform:uppercase;
    line-height:1.5;
  }
  .arcade-btn small{display:block;font-size:7px;color:#5a2a00;margin-top:6px;}
  .arcade-btn:hover{filter:brightness(1.1);}
  .arcade-btn:active{transform:translateY(5px);box-shadow:0 0 0 #7a3a00,0 0 14px rgba(255,122,0,.6);}
  .arcade-btn.blue{background:linear-gradient(180deg,var(--blue),#0077aa);color:#001;box-shadow:0 5px 0 #00374d,0 0 14px rgba(0,229,255,.6);}
  .arcade-btn.pink{background:linear-gradient(180deg,#ff7ac1,var(--pink));color:#1a0010;box-shadow:0 5px 0 #7a003f,0 0 14px rgba(255,30,142,.6);}
  .arcade-btn.green{background:linear-gradient(180deg,#9bffcf,var(--green));color:#003;box-shadow:0 5px 0 #00532b,0 0 14px rgba(0,255,133,.6);}
  .arcade-btn.purple{background:linear-gradient(180deg,#b380ff,var(--purple));color:#fff;box-shadow:0 5px 0 #2e0066,0 0 14px rgba(123,0,255,.6);}

  /* ---- HUD ---- */
  .hud{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
  }
  .hud .box{
    background:#000;
    border:3px solid var(--blue);
    border-radius:10px;
    padding:8px 12px;
    text-align:center;
    min-width:92px;
  }
  .hud .lbl{font-size:7px;color:var(--blue);margin-bottom:6px;letter-spacing:1px;}
  .hud .val{font-size:16px;color:#fff;}
  /* Shot clock = red LED */
  .shotclock{
    background:#1a0000;
    border:3px solid #ff2a2a;
    box-shadow:0 0 18px rgba(255,42,42,.7), inset 0 0 14px rgba(255,0,0,.4);
  }
  .shotclock .lbl{color:#ff8a8a;}
  .shotclock .val{
    font-size:22px;
    color:#ff3a3a;
    text-shadow:0 0 10px #ff0000, 0 0 20px #ff0000;
  }
  .shotclock.warn .val{color:#fff200;text-shadow:0 0 12px #ffd400;}
  .shotclock.danger{animation:flashred .4s steps(1) infinite;}
  @keyframes flashred{50%{border-color:#fff;box-shadow:0 0 26px #fff;}}

  /* ---- Player photo ---- */
  .jumbo{
    position:relative;
    margin:0 auto 16px;
    width:230px;height:230px;
    border-radius:14px;
    border:5px solid var(--orange);
    background:#000;
    box-shadow:0 0 26px var(--orange), inset 0 0 30px rgba(0,0,0,.6);
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .jumbo img{width:100%;height:100%;object-fit:cover;object-position:top center;}

  .question{
    text-align:center;font-size:11px;color:var(--yellow);
    margin-bottom:6px;text-shadow:1px 1px 0 #000;
  }
  .mode-tag{
    text-align:center;font-size:8px;color:#9d86d6;
    margin-bottom:14px;letter-spacing:1px;
  }

  /* ---- Answer options ---- */
  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .opt{
    font-family:'Press Start 2P',monospace;
    font-size:10px;line-height:1.5;
    color:#fff;
    background:linear-gradient(180deg,#2b0a5a,#16002e);
    border:3px solid var(--purple);
    border-radius:10px;
    padding:14px 8px;
    cursor:pointer;
    box-shadow:0 4px 0 #1a0033;
    transition:transform .06s, filter .1s;
    min-height:58px;
  }
  .opt:hover:not(:disabled){filter:brightness(1.25);border-color:var(--blue);}
  .opt:active:not(:disabled){transform:translateY(4px);}
  .opt:disabled{cursor:default;opacity:.95;}
  .opt.correct{background:linear-gradient(180deg,#00c96b,#008f4c);border-color:#aaffd5;box-shadow:0 0 18px var(--green);}
  .opt.wrong{background:linear-gradient(180deg,#c91d1d,#7a0000);border-color:#ffb3b3;box-shadow:0 0 18px #ff2a2a;}

  /* ---- Feedback banner ---- */
  .banner{
    position:absolute;left:0;right:0;top:42%;
    text-align:center;
    font-family:'Bungee',sans-serif;
    font-size:clamp(26px,8vw,52px);
    pointer-events:none;
    opacity:0;
    z-index:50;
  }
  .banner.show{animation:pop 1s ease-out;}
  .banner.good{color:var(--green);text-shadow:0 0 18px var(--green),3px 3px 0 #000;}
  .banner.bad{color:#ff3a3a;text-shadow:0 0 18px #ff0000,3px 3px 0 #000;}
  @keyframes pop{
    0%{opacity:0;transform:scale(.4) rotate(-8deg);}
    20%{opacity:1;transform:scale(1.15) rotate(3deg);}
    70%{opacity:1;transform:scale(1) rotate(0);}
    100%{opacity:0;transform:scale(1.05);}
  }

  /* ---- End screen ---- */
  .final-score{
    font-family:'Bungee',sans-serif;
    font-size:clamp(46px,16vw,96px);
    text-align:center;
    background:linear-gradient(180deg,#fff,var(--yellow),var(--orange));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 4px 0 #000;
    margin:6px 0;
  }
  .rating{text-align:center;font-size:14px;color:var(--blue);margin:8px 0 4px;text-shadow:2px 2px 0 #000;}
  .breakdown{text-align:center;font-size:9px;color:#bda7ff;line-height:2;margin:14px 0 6px;}
  .center{text-align:center;}
  .mt{margin-top:18px;}

  .hidden{display:none!important;}

  .foot{text-align:center;font-size:7px;color:#6a5a99;line-height:2;margin-top:18px;}
  .foot a{color:var(--blue);text-decoration:none;}
  @media (max-width:520px){
    body{
      align-items:flex-start;
      padding:10px;
    }
    .cabinet{
      padding:16px 12px 22px;
    }
    .options{grid-template-columns:1fr;}
    .jumbo{width:200px;height:200px;}
  }
</style>
</head>

// Difficulty bands. tiers = which player tiers appear at this level.
// Ordered easiest -> hardest; higher levels drop the household names and add
// deeper, more obscure players.
// Exclusive tier bands — each difficulty is its own fame stratum, so the
// hardest level is journeymen ONLY (no stars leak in).
const DIFFICULTIES = {
  rookie:  {label:"ROOKIE",  tiers:[1], sub:"Superstars & icons"},
  starter: {label:"STARTER", tiers:[2], sub:"Stars & All-Stars"},
  veteran: {label:"VETERAN", tiers:[3], sub:"Starters & role players"},
  diehard: {label:"DIEHARD", tiers:[4], sub:"Deep cuts & journeymen"},
};
const ERA_LABEL = {"1980s":"80's","1990s":"90's","2000s":"00's","2010s":"2010's","Current":"Current"};
const UNAVAILABLE_PHOTOS = new Set([
  "weathcl01", "newmajo01", "jonesca01", "wingada01", "pincked01",
  "perryel01", "vaughja01", "thompla01", "sealyma01", "okoremi01",
  "sandemi01", "ellispe01", "jonespo01", "perduwi01"
]);

// Fallback silhouette (data URI SVG) when no photo can be loaded
const FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' width='230' height='230'>
     <rect width='100%' height='100%' fill='#000'/>
     <text x='50%' y='44%' font-size='90' fill='#ff7a00' text-anchor='middle'
       dominant-baseline='middle' font-family='monospace'>?</text>
     <text x='50%' y='74%' font-size='12' fill='#00e5ff' text-anchor='middle'
       font-family='monospace'>MYSTERY BALLER</text>
   </svg>`);

const TOTAL_ROUNDS = 10;
const GAME_SECONDS = 60;

// ---- State ----
let pool = [], queue = [], roundIdx = 0, score = 0, roundTotal = 0;
let endTime = 0, rafId = null, locked = false;
let selectedDiff = "rookie";

// ---- DOM ----
const $ = id => document.getElementById(id);
const startScreen = $("start-screen"), gameScreen = $("game-screen"), endScreen = $("end-screen");
const clockEl = $("clock"), clockBox = $("clockBox");
const scoreEl = $("score"), roundEl = $("round"), roundTotalEl = $("roundTotal");
const imgEl = $("playerImg"), optionsEl = $("options"), bannerEl = $("banner"), modeTag = $("modeTag");

// ---- Utils ----
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

// ---- Tiny WebAudio arcade blips (no external files) ----
let actx = null;
let audioWarningShown = false;
const AudioContextClass = window.AudioContext || window.webkitAudioContext;

function getAudioContext(){
  if(!AudioContextClass){
    if(!audioWarningShown){
      console.warn("Web Audio is not supported by this browser.");
      audioWarningShown = true;
    }
    return null;
  }
  if(!actx){
    try{
      actx = new AudioContextClass();
    }catch(error){
      console.warn("Unable to initialize game audio.", error);
      audioWarningShown = true;
      return null;
    }
  }
  return actx;
}

function unlockAudio(){
  const ctx = getAudioContext();
  if(!ctx) return;
  if(ctx.state === "suspended"){
    ctx.resume().catch(error => console.warn("Unable to resume game audio.", error));
  }
  const source = ctx.createBufferSource();
  source.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
  source.connect(ctx.destination);
  source.start();
}

function beep(freq, dur, type="square", vol=0.08){
  const ctx = getAudioContext();
  if(!ctx) return;
  const play = () => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.stop(ctx.currentTime + dur);
  };
  if(ctx.state === "suspended"){
    ctx.resume()
      .then(play)
      .catch(error => console.warn("Unable to play game audio.", error));
  }else{
    play();
  }
}
const sndGood = ()=>{beep(660,0.08);setTimeout(()=>beep(990,0.12),90);};
const sndBad  = ()=>{beep(160,0.25,"sawtooth");};
const sndBuzz = ()=>{beep(110,0.6,"sawtooth",0.12);};

// ---- Screen control ----
function show(el){ [startScreen,gameScreen,endScreen].forEach(s=>s.classList.add("hidden")); el.classList.remove("hidden"); }

// ---- Photo loader with graceful fallback chain: BBR -> NBA -> silhouette ----
function loadPhoto(player){
  const chain = [BBR(player.bbr)];
  if(player.nba) chain.push(NBA(player.nba));
  chain.push(FALLBACK);
  let i = 0;
  imgEl.onerror = () => {
    i++;
    if(i < chain.length){ imgEl.src = chain[i]; }
    else { imgEl.onerror = null; }
  };
  imgEl.src = chain[0];
}

// ---- Start a game for a chosen era + the selected difficulty ----
function startGame(era){
  unlockAudio();
  const diff = DIFFICULTIES[selectedDiff];
  pool = PLAYERS.filter(p =>
    p.eras.includes(era) &&
    diff.tiers.includes(p.tier) &&
    (p.nba || !UNAVAILABLE_PHOTOS.has(p.bbr))
  );
  if(pool.length < 2){ return; } // safety — every era/difficulty is seeded with plenty
  queue = shuffle(pool.slice()).slice(0, Math.min(TOTAL_ROUNDS, pool.length));
  roundTotal = queue.length;
  roundIdx = 0; score = 0; locked = false;
  scoreEl.textContent = "0";
  roundTotalEl.textContent = roundTotal;
  modeTag.textContent = `${diff.label} · ${ERA_LABEL[era]} · ${diff.sub}`;
  show(gameScreen);
  // Start the single 60-second shot clock for the whole game
  endTime = Date.now() + GAME_SECONDS*1000;
  tickClock();
  renderRound();
}

// ---- Shot clock loop (smooth via requestAnimationFrame) ----
function tickClock(){
  const remainMs = endTime - Date.now();
  const remain = Math.max(0, remainMs/1000);
  clockEl.textContent = remain >= 10 ? Math.ceil(remain) : remain.toFixed(1);
  clockBox.classList.toggle("warn", remain <= 10 && remain > 5);
  clockBox.classList.toggle("danger", remain <= 5);
  if(remainMs <= 0){ endGame(true); return; }
  rafId = requestAnimationFrame(tickClock);
}

// ---- Render one round ----
function renderRound(){
  locked = false;
  roundEl.textContent = roundIdx + 1;
  const player = queue[roundIdx];

  // Load headshot (Basketball-Reference primary) with graceful fallback
  loadPhoto(player);

  // Build options: correct + distractors from the SAME era + difficulty pool
  const nOpts = Math.min(4, pool.length);
  const distractors = shuffle(pool.filter(p => p.name !== player.name)).slice(0, nOpts - 1);
  const opts = shuffle([player, ...distractors]);

  optionsEl.innerHTML = "";
  opts.forEach(o=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = o.name;
    b.onclick = () => answer(b, o, player);
    optionsEl.appendChild(b);
  });
}

// ---- Handle an answer ----
function answer(btn, chosen, correct){
  if(locked) return;
  locked = true;
  const buttons = [...optionsEl.querySelectorAll(".opt")];
  buttons.forEach(b=>b.disabled = true);

  const right = chosen.name === correct.name;
  if(right){
    score++;
    scoreEl.textContent = score;
    btn.classList.add("correct");
    flash("BOOMSHAKALAKA!", "good");
    sndGood();
  }else{
    btn.classList.add("wrong");
    buttons.forEach(b => { if(b.textContent === correct.name) b.classList.add("correct"); });
    flash("REJECTED!", "bad");
    sndBad();
  }

  // Advance after a short beat (clock keeps running the whole time)
  setTimeout(()=>{
    roundIdx++;
    if(roundIdx >= queue.length){ endGame(false); }
    else if(Date.now() < endTime){ renderRound(); }
    // if time already expired, tickClock() will have ended the game
  }, 1000);
}

// ---- Feedback banner ----
function flash(text, cls){
  bannerEl.textContent = text;
  bannerEl.className = "banner " + cls;
  void bannerEl.offsetWidth;            // restart animation
  bannerEl.classList.add("show");
}

// ---- End the game ----
function endGame(timeUp){
  if(rafId) cancelAnimationFrame(rafId);
  rafId = null;
  sndBuzz();

  $("endTitle").textContent = timeUp ? "⏰ SHOT CLOCK VIOLATION!" : "🏆 FINAL BUZZER!";
  $("finalScore").textContent = score;
  $("finalTotal").textContent = roundTotal;

  const answered = timeUp ? roundIdx : queue.length;
  const pct = roundTotal ? score / roundTotal : 0;
  let rating, color;
  if(pct >= 1){ rating="🐐 HALL OF FAME LEGEND"; color="var(--yellow)"; }
  else if(pct >= 0.8){ rating="⭐ ALL-STAR STARTER"; color="var(--green)"; }
  else if(pct >= 0.6){ rating="🔥 SOLID ROLE PLAYER"; color="var(--orange)"; }
  else if(pct >= 0.4){ rating="🏀 BENCH WARMER"; color="var(--blue)"; }
  else if(pct >= 0.2){ rating="😅 SUMMER LEAGUE TRYOUT"; color="var(--pink)"; }
  else{ rating="🪑 ROOKIE — KEEP PRACTICING"; color="#bda7ff"; }

  const r = $("ratingText"); r.textContent = rating; r.style.color = color;

  $("breakdown").innerHTML =
    `You answered <b>${answered}</b> of ${roundTotal} players<br>` +
    `Correct: <b>${score}</b> &nbsp;·&nbsp; Missed: <b>${answered - score}</b>` +
    (timeUp ? `<br><span style="color:#ff8a8a">Time ran out!</span>` :
              `<br><span style="color:var(--green)">You beat the clock!</span>`);

  show(endScreen);
}

// ---- Wire up difficulty pills ----
function setDifficulty(diff){
  selectedDiff = diff;
  document.querySelectorAll(".diff-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.diff === diff);
  });
}
document.querySelectorAll(".diff-btn").forEach(b=>{
  b.addEventListener("click", ()=> setDifficulty(b.dataset.diff));
});
setDifficulty(selectedDiff); // default highlight

// ---- Wire up era buttons (these tip off the game) ----
document.querySelectorAll(".decades .arcade-btn").forEach(b=>{
  b.addEventListener("click", ()=> startGame(b.dataset.decade));
});
$("playAgain").addEventListener("click", ()=> show(startScreen));
</script>
